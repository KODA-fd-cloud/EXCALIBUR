name: KODA blog Telegram tick

# Tick часто (каждые 15 мин) — чтобы «ок/нет» не висели до 15:00.
# Scout + тяжёлые слоты: 08:00 и 15:00 МСК (= 05:00 и 12:00 UTC).
# После «ок»: если статья готова (html+QA PASS) — сразу публикация + ссылка в Telegram.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Один тик за раз: иначе параллельные runs жрут один «ок» и спамят «Тема принята»
concurrency:
  group: koda-blog-telegram-tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install paramiko ddgs Pillow

      - name: Scout refill topics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          # Скрипт сам skip, если unpublished >= 3. Telegram-notify — в «больших» часах.
          HOUR_UTC=$(date -u +%H)
          EXTRA=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$HOUR_UTC" = "05" ] || [ "$HOUR_UTC" = "12" ]; then
            EXTRA="--notify --prefer-cursor"
          fi
          # shellcheck disable=SC2086
          # min-unpublished считает proposeable (не rejected). При 0 — всегда дозаправка.
          python scripts/excalibur_blog_scout_ci.py --count 5 --min-unpublished 3 $EXTRA | tee scout.json
          # НЕ пушим Scout отдельно: иначе Commit state в конце job не может
          # запушить pending (non-fast-forward) и «нет» откатывается → вечный B42.

      - name: Telegram tick
        id: tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID"
            exit 2
          fi
          python scripts/excalibur_blog_telegram_notify.py tick | tee tick.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("tick.json").read_text(encoding="utf-8").strip().splitlines()[-1]
          data = json.loads(raw)
          Path("tick-status.txt").write_text(str(data.get("status") or ""), encoding="utf-8")
          Path("tick-topic.txt").write_text(str(data.get("topic_id") or ""), encoding="utf-8")
          print(data)
          PY
          echo "status=$(cat tick-status.txt)" >> "$GITHUB_OUTPUT"
          echo "topic_id=$(cat tick-topic.txt)" >> "$GITHUB_OUTPUT"

      - name: Write if approved (no article yet)
        id: write
        if: ${{ steps.tick.outputs.status == 'writing' || steps.tick.outputs.status == 'queued_write' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          pip install cursor-sdk || true
          python scripts/excalibur_blog_write_approved.py | tee write.json
          # Cloud Agent pushes articles to master — refresh tree, but KEEP local pending/offset
          mkdir -p /tmp/koda-tick-state
          cp memory/topics/pending-approval.json /tmp/koda-tick-state/ || true
          cp memory/topics/telegram-updates.offset /tmp/koda-tick-state/ || true
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/koda-tick-state/pending-approval.json memory/topics/ 2>/dev/null || true
          cp /tmp/koda-tick-state/telegram-updates.offset memory/topics/ 2>/dev/null || true

      - name: Publish if approved (writing)
        id: finish
        if: ${{ steps.tick.outputs.status == 'writing' || steps.tick.outputs.status == 'queued_write' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCALIBUR_BLOG_ALLOW_PUBLISH: ${{ secrets.EXCALIBUR_BLOG_ALLOW_PUBLISH }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          DOCKER_WP_CONTAINER: ${{ secrets.DOCKER_WP_CONTAINER }}
        run: |
          set -euo pipefail
          python scripts/excalibur_blog_finish_approved.py | tee finish.json

      - name: Commit state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "koda-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve local tick state across rebase (pending/rejects/offset)
          mkdir -p /tmp/koda-tick-commit
          cp memory/topics/pending-approval.json /tmp/koda-tick-commit/ 2>/dev/null || true
          cp memory/topics/rejected-topics.json /tmp/koda-tick-commit/ 2>/dev/null || true
          cp memory/topics/telegram-updates.offset /tmp/koda-tick-commit/ 2>/dev/null || true
          cp memory/topics/telegram-cooldowns.json /tmp/koda-tick-commit/ 2>/dev/null || true
          git fetch origin master
          git pull --rebase origin master || {
            echo "rebase failed — abort and retry with ours for topic state"
            git rebase --abort || true
            git reset --soft origin/master || true
          }
          cp /tmp/koda-tick-commit/pending-approval.json memory/topics/ 2>/dev/null || true
          cp /tmp/koda-tick-commit/rejected-topics.json memory/topics/ 2>/dev/null || true
          cp /tmp/koda-tick-commit/telegram-updates.offset memory/topics/ 2>/dev/null || true
          cp /tmp/koda-tick-commit/telegram-cooldowns.json memory/topics/ 2>/dev/null || true
          git add memory/topics/pending-approval.json memory/topics/rejected-topics.json memory/topics/telegram-updates.offset memory/topics/telegram-cooldowns.json memory/topics/blog-topics.md shared/published-articles.md memory/blog/articles || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(blog): telegram tick / auto-publish approved topic"
            git push origin HEAD:master
          fi
