name: KODA blog Telegram tick

# Tick часто (каждые 15 мин) — чтобы «ок/нет» не висели до 15:00.
# Scout + тяжёлые слоты: 08:00 и 15:00 МСК (= 05:00 и 12:00 UTC).
# После «ок»: если статья готова (html+QA PASS) — сразу публикация + ссылка в Telegram.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Один тик за раз: иначе параллельные runs жрут один «ок» и спамят «Тема принята»
concurrency:
  group: koda-blog-telegram-tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install paramiko ddgs Pillow

      - name: Scout refill topics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          HOUR_UTC=$(date -u +%H)
          EXTRA=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$HOUR_UTC" = "05" ] || [ "$HOUR_UTC" = "12" ]; then
            EXTRA="--notify --prefer-cursor"
          fi
          # shellcheck disable=SC2086
          # Не пушим Scout отдельно — один commit state в конце, иначе pending/offset теряются.
          python scripts/excalibur_blog_scout_ci.py --count 5 --min-unpublished 3 $EXTRA | tee scout.json

      - name: Telegram tick
        id: tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID"
            exit 2
          fi
          python scripts/excalibur_blog_telegram_notify.py tick | tee tick.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("tick.json").read_text(encoding="utf-8").strip().splitlines()[-1]
          data = json.loads(raw)
          Path("tick-status.txt").write_text(str(data.get("status") or ""), encoding="utf-8")
          Path("tick-topic.txt").write_text(str(data.get("topic_id") or ""), encoding="utf-8")
          print(data)
          PY
          echo "status=$(cat tick-status.txt)" >> "$GITHUB_OUTPUT"
          echo "topic_id=$(cat tick-topic.txt)" >> "$GITHUB_OUTPUT"

      - name: Write if approved (no article yet)
        id: write
        if: ${{ steps.tick.outputs.status == 'writing' || steps.tick.outputs.status == 'queued_write' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          pip install cursor-sdk || true
          python scripts/excalibur_blog_write_approved.py | tee write.json
          # Cloud Agent may push articles — refresh tree, KEEP telegram state
          mkdir -p /tmp/koda-tick-state
          for f in pending-approval.json rejected-topics.json acked-topics.json last-proposal.json telegram-updates.offset telegram-cooldowns.json; do
            cp "memory/topics/$f" /tmp/koda-tick-state/ 2>/dev/null || true
          done
          git fetch origin master
          git reset --hard origin/master
          for f in pending-approval.json rejected-topics.json acked-topics.json last-proposal.json telegram-updates.offset telegram-cooldowns.json; do
            cp "/tmp/koda-tick-state/$f" memory/topics/ 2>/dev/null || true
          done

      - name: Publish if approved (writing)
        id: finish
        if: ${{ steps.tick.outputs.status == 'writing' || steps.tick.outputs.status == 'queued_write' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCALIBUR_BLOG_ALLOW_PUBLISH: ${{ secrets.EXCALIBUR_BLOG_ALLOW_PUBLISH }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          DOCKER_WP_CONTAINER: ${{ secrets.DOCKER_WP_CONTAINER }}
        run: |
          set -euo pipefail
          python scripts/excalibur_blog_finish_approved.py | tee finish.json

      - name: Commit state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "koda-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot telegram/runtime state BEFORE any git sync
          mkdir -p /tmp/koda-tick-commit
          for f in pending-approval.json rejected-topics.json acked-topics.json last-proposal.json telegram-updates.offset telegram-cooldowns.json; do
            cp "memory/topics/$f" /tmp/koda-tick-commit/ 2>/dev/null || true
          done
          cp -a shared/published-articles.md /tmp/koda-tick-commit/published-articles.md 2>/dev/null || true
          cp -a memory/topics/blog-topics.md /tmp/koda-tick-commit/blog-topics.md 2>/dev/null || true

          # Clean sync to remote tip (dirty tree previously broke pull --rebase → state never pushed)
          git fetch origin master
          git reset --hard origin/master

          # Restore authoritative local state from this job
          mkdir -p memory/topics
          for f in pending-approval.json rejected-topics.json acked-topics.json last-proposal.json telegram-updates.offset telegram-cooldowns.json; do
            cp "/tmp/koda-tick-commit/$f" "memory/topics/$f" 2>/dev/null || true
          done
          # cooldowns must exist so later tools don't trip
          if [ ! -f memory/topics/telegram-cooldowns.json ]; then
            echo '{}' > memory/topics/telegram-cooldowns.json
          fi
          cp /tmp/koda-tick-commit/published-articles.md shared/published-articles.md 2>/dev/null || true
          cp /tmp/koda-tick-commit/blog-topics.md memory/topics/blog-topics.md 2>/dev/null || true

          # ВАЖНО: git add с несуществующим pathspec валит ВЕСЬ add → "No changes" навечно.
          # Добавляем только то, что есть на диске.
          for f in \
            memory/topics/pending-approval.json \
            memory/topics/rejected-topics.json \
            memory/topics/acked-topics.json \
            memory/topics/last-proposal.json \
            memory/topics/telegram-updates.offset \
            memory/topics/telegram-cooldowns.json \
            memory/topics/blog-topics.md \
            shared/published-articles.md
          do
            if [ -e "$f" ]; then
              git add -- "$f"
            fi
          done
          if [ -d memory/blog/articles ]; then
            git add -- memory/blog/articles || true
          fi

          if git diff --cached --quiet; then
            echo "No changes"
            git status -sb || true
          else
            git commit -m "chore(blog): telegram tick / auto-publish approved topic"
            if ! git push origin HEAD:master; then
              git fetch origin master
              git rebase origin/master || git rebase --abort || true
              for f in pending-approval.json rejected-topics.json acked-topics.json last-proposal.json telegram-updates.offset telegram-cooldowns.json; do
                cp "/tmp/koda-tick-commit/$f" "memory/topics/$f" 2>/dev/null || true
              done
              cp /tmp/koda-tick-commit/published-articles.md shared/published-articles.md 2>/dev/null || true
              for f in memory/topics/*.json memory/topics/telegram-updates.offset memory/topics/blog-topics.md shared/published-articles.md; do
                if [ -e "$f" ]; then git add -- "$f"; fi
              done
              git commit -m "chore(blog): telegram tick state (retry)" || true
              git push origin HEAD:master
            fi
          fi
